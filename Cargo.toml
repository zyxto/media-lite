[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/providers",
    "crates/player",
    "crates/cli",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/zyxto/media-lite"
rust-version = "1.85"

[workspace.dependencies]
media-lite-core = { path = "crates/core" }
media-lite-providers = { path = "crates/providers" }
media-lite-player = { path = "crates/player" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lru = "0.19"
sha2 = "0.11"
base64 = "0.23"
log = "0.4"
url = "2.5"
env_logger = "0.11"

# Compilación pensada para el Pentium T4500: sin target-cpu=native ni x86-64-v2 (ver roadmap 2.8).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
