# Teclas de mpv para la ventana de video de media-lite. Son las de mplayer que usaban las
# referencias (Sanson y Lumière): 9/0 y /,* para el volumen, m para silenciar, f para pantalla
# completa, [ ] { } para la velocidad. Las flechas siguen siendo las de mpv (±5 s y ±1 min).
9 add volume -2
0 add volume 2
/ add volume -2
* add volume 2
m cycle mute
f cycle fullscreen
[ multiply speed 1/1.1
] multiply speed 1.1
{ multiply speed 0.5
} multiply speed 2.0
s screenshot
q quit
